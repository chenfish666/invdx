# A second spack environment, separate from ../env/ (the meep environment,
# which is frozen and must not be disturbed).
#
# It holds one thing: Lmod, so that `module load meep` works against the meep
# environment next door. On a real cluster Lmod is provided by the site and
# this environment is unnecessary -- it exists for machines that have no
# module system, or only the older Tcl `environment-modules`, which spack's
# hierarchical module generation does not target.
#
# Deliberately NOT here: a container toolchain. Packaging this project into a
# .sif is a reasonable thing to want on a multi-node cluster, but it is the
# cluster user's call how to do it, and shipping an unused toolchain reads as
# a feature the project has when it does not.
#
# Requires spack v1.2.0; see ../bootstrap.sh to bootstrap it.
spack:
  specs:
  - lmod
  packages:
    all:
      require:
      - target=x86_64_v3       # aligned with ../env/spack.yaml; stays movable
    gettext:
      # The user scope (~/.spack/packages.yaml) marks the system gettext-base as
      # external with buildable:false -- but that build ships msgfmt/xgettext
      # without autopoint, so autogen.sh in procps (a build dep of lmod) fails.
      #
      # Requesting a variant the external does not have (+libunistring, which
      # defaults to ~libunistring) forces the concretizer to abandon the
      # external and build a complete gettext itself. This overrides even
      # buildable:false, because the external spec simply does not satisfy the
      # requested variant.
      buildable: true
      require: [+libunistring]
  concretizer:
    unify: true
  repos:
    builtin:
      git: https://github.com/spack/spack-packages.git
      tag: v2026.06.0          # same pin as ../env/spack.yaml: one recipe snapshot for both environments
  config:
    build_jobs: 32
  modules:
    default:
      lmod:
        core_compilers:
        - gcc@11.4.0/4xzbjox43immf63pexifjzhwt2xd7ujq
        - gcc@12.3.0/tlh6jd6svc6ark6a6ctoy6h36cy64nzl
