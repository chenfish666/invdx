# Requires spack v1.2.0; see ../bootstrap.sh to bootstrap it.
spack:
  specs:
    # Project-owned package repo (namespace invdx, named explicitly -- see the
    # repos section below)
    - invdx.meep@1.34.0 +python +mpi +hdf5 +libctl +harminv +mpb +gsl +openmp ~single
    - "py-numpy@2:"           # match the conda baseline (pymeep 1.34.0 is numpy-2 era)
    - py-mpi4py
    - py-scipy
    - py-matplotlib
  packages:
    all:
      require:
        - "target=x86_64_v3"   # generic microarch: stays movable between hosts
    mpi:
      require: [mpich]         # match conda meep (mpich 4.3.2); fewer variables in G5
    # The swig pin (@=4.0.2, once needed because meep<=1.31 clashed with
    # SWIG 4.1+) was dropped when this bumped to 1.34.0, deliberately, to
    # check that the upstream fix holds. It does -- see "Three pits actually
    # fallen into", item 1, in docs/env.md.
  concretizer:
    unify: true
    reuse: false               # clean lineage; flip to true later to save build time
  repos:
    builtin:
      git: https://github.com/spack/spack-packages.git
      tag: v2026.06.0          # the second-level pin. Without this line the pin above buys nothing.
    invdx: $env/../spack_repo/invdx
  view:
    default:
      root: .spack-env/view
      link: all
      link_type: hardlink      # Load-bearing: with symlink, the view's bin/python resolves sys.prefix
      # back to the real spack prefix. See docs/env.md.
  config:
    build_jobs: 32
