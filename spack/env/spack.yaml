# 需要 spack v1.2.0；bootstrap 見 ../bootstrap.sh
spack:
  specs:
    # 第一段用這行；第二段改成 invdx.meep@1.34.0（namespace 明確指定）
    - meep@1.29.0 +python +mpi +hdf5 +libctl +harminv +mpb +gsl +openmp ~single
    - py-numpy@1.26.4        # 第二段可放行到 @2:
    - py-mpi4py
    - py-scipy
    - py-matplotlib
  packages:
    all:
      require:
        - "target=x86_64_v3"   # 泛用微架構，保留可遷移性
    mpi:
      require: [mpich]         # 對齊 conda meep(mpich 4.3.2)，減少 G5 變因
    swig:
      require: ["@=4.0.2"]     # meep<=1.31 與 SWIG 4.1+ 衝突（structmember.h 的 READONLY
                               # 宏打到 meep.hpp 的 enum）；釘回 1.29 時代已知良好版
  concretizer:
    unify: true
    reuse: false               # 乾淨譜系；日後可改 true 省時
  repos:
    builtin:
      git: https://github.com/spack/spack-packages.git
      tag: v2026.06.0          # 第二層釘版，缺這行等於沒釘
    # 第二段再打開：
    # invdx: $env/../spack_repo/invdx
  view:
    default:
      root: .spack-env/view
      link: all
      link_type: hardlink      # 關鍵，見 L2.3
  config:
    build_jobs: 32
