[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
license = {text = "MIT"}
name = "invdx"
version = "0.1.0"
description = "GPU FDTD toolbox for passive photonic devices: fdtdx (GPU) cross-checked against Meep, with verification gates, adjoint inverse design, fabrication-tolerance analysis and export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "autograd",
    "gdstk",
    "pyevtk",
]

[project.optional-dependencies]
# scripts/bootstrap.sh installs these (uv sync --extra gpu; see docs/env.md);
# listed here so `pip install -e .[gpu]` reproduces it. Kept out of core deps
# so the package stays importable inside the Meep environment (numpy-only
# modules).
gpu = ["jax[cuda12]==0.11.0", "fdtdx==0.6.2", "optax"]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
